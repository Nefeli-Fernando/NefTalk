<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NefTalk</title>
    <link rel="icon" type="image/png" href="Assets/Logos/NefTalk N-Signal.png">
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="dist/purify.min.js"></script>

</head>
<body>
    <main class="chat">
        <header class="chat-header">
            <img class="logo" src="Assets/Logos/NefTalk N-Signal.png" alt="NefTalk logo">
            <div class="chat-title">
                <h1>NefTalk</h1>
                <p>Ask me anything</p>
            </div>
            <span class="status" title="Online" aria-label="Online"></span>
        </header>

        <section class="messages" id="respond" aria-label="Conversation">
            <div class="row bot">
                <span class="label">NefTalk</span>
                <div class="bubble">Hi there! 👋 I'm NefTalk. What would you like to talk about today?</div>
            </div>
        </section>

        <form class="input-bar" id="messageForm">
            <input type="text" placeholder="Type your message..." aria-label="Message" id="txtUserInput" autocomplete="off">
            <button type="submit" aria-label="Send">➤</button>
        </form>
    </main>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
